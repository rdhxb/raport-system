spring.application.name=krs-service
server.port=${SERVER_PORT:8081}

# PostgreSQL - defaults match .env for running locally outside Docker
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:krs_db}
spring.datasource.username=${DB_USER:krs_user}
spring.datasource.password=${DB_PASSWORD:krs_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:rabbit_user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rabbit_password}
