spring.application.name=whiteList-service
server.port=${SERVER_PORT:8083}

# PostgreSQL - defaults match .env for running locally outside Docker
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:whitelist_db}
spring.datasource.username=${DB_USER:whitelist_user}
spring.datasource.password=${DB_PASSWORD:whitelist_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:rabbit_user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rabbit_password}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# dlq / retry
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s

# White List API (wl-api.mf.gov.pl)
wl.api.url=https://wl-api.mf.gov.pl/api
