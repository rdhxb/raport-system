spring.application.name=ceidg-service
server.port=${SERVER_PORT:8087}

# PostgreSQL - defaults match .env for running locally outside Docker
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5439}/${DB_NAME:ceidg_db}
spring.datasource.username=${DB_USER:ceidg_user}
spring.datasource.password=${DB_PASSWORD:ceidg_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:rabbit_user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rabbit_password}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# CEIDG API (dane.biznes.gov.pl) - token only from env, never commit it
ceidg.api.url=https://dane.biznes.gov.pl/api/ceidg/v3
ceidg.api.test.url=https://test-dane.biznes.gov.pl/api/ceidg/v3

ceidg.api.token=${CEIDG_API_TOKEN}
