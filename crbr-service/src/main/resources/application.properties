spring.application.name=crbr-service
server.port=${SERVER_PORT:8085}

# PostgreSQL - defaults match .env for running locally outside Docker
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5437}/${DB_NAME:crbr_db}
spring.datasource.username=${DB_USER:crbr_user}
spring.datasource.password=${DB_PASSWORD:crbr_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:rabbit_user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rabbit_password}
spring.rabbitmq.listener.simple.default-requeue-rejected=false



crbr.api.url=https://bramka-crbr.mf.gov.pl:5058/uslugiBiznesowe/uslugiESB/AP/ApiPrzegladoweCRBR/2022/12/01