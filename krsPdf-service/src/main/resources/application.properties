spring.application.name=krsPdf-service
server.port=${SERVER_PORT:8084}

# PostgreSQL - defaults match .env for running locally outside Docker
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/${DB_NAME:krspdf_db}
spring.datasource.username=${DB_USER:krspdf_user}
spring.datasource.password=${DB_PASSWORD:krspdf_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:rabbit_user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rabbit_password}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Downloaded PDFs
krspdf.storage-dir=${PDF_STORAGE_DIR:./data/pdf}
