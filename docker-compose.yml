services:

  krs-db:
    image: ${POSTGRES_IMAGE}
    container_name: krs-db
    environment:
      POSTGRES_DB: ${KRS_DB_NAME}
      POSTGRES_USER: ${KRS_DB_USER}
      POSTGRES_PASSWORD: ${KRS_DB_PASSWORD}
    ports:
      - "${KRS_DB_PORT}:5432"
    volumes:
      - krs-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KRS_DB_USER} -d ${KRS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  raport-db:
    image: ${POSTGRES_IMAGE}
    container_name: raport-db
    environment:
      POSTGRES_DB: ${RAPORT_DB_NAME}
      POSTGRES_USER: ${RAPORT_DB_USER}
      POSTGRES_PASSWORD: ${RAPORT_DB_PASSWORD}
    ports:
      - "${RAPORT_DB_PORT}:5432"
    volumes:
      - raport-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RAPORT_DB_USER} -d ${RAPORT_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  whitelist-db:
    image: ${POSTGRES_IMAGE}
    container_name: whitelist-db
    environment:
      POSTGRES_DB: ${WHITELIST_DB_NAME}
      POSTGRES_USER: ${WHITELIST_DB_USER}
      POSTGRES_PASSWORD: ${WHITELIST_DB_PASSWORD}
    ports:
      - "${WHITELIST_DB_PORT}:5432"
    volumes:
      - whitelist-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WHITELIST_DB_USER} -d ${WHITELIST_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  crbr-db:
    image: ${POSTGRES_IMAGE}
    container_name: crbr-db
    environment:
      POSTGRES_DB: ${CRBR_DB_NAME}
      POSTGRES_USER: ${CRBR_DB_USER}
      POSTGRES_PASSWORD: ${CRBR_DB_PASSWORD}
    ports:
      - "${CRBR_DB_PORT}:5432"
    volumes:
      - crbr-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CRBR_DB_USER} -d ${CRBR_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  sudop-db:
    image: ${POSTGRES_IMAGE}
    container_name: sudop-db
    environment:
      POSTGRES_DB: ${SUDOP_DB_NAME}
      POSTGRES_USER: ${SUDOP_DB_USER}
      POSTGRES_PASSWORD: ${SUDOP_DB_PASSWORD}
    ports:
      - "${SUDOP_DB_PORT}:5432"
    volumes:
      - sudop-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUDOP_DB_USER} -d ${SUDOP_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ceidg-db:
    image: ${POSTGRES_IMAGE}
    container_name: ceidg-db
    environment:
      POSTGRES_DB: ${CEIDG_DB_NAME}
      POSTGRES_USER: ${CEIDG_DB_USER}
      POSTGRES_PASSWORD: ${CEIDG_DB_PASSWORD}
    ports:
      - "${CEIDG_DB_PORT}:5432"
    volumes:
      - ceidg-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CEIDG_DB_USER} -d ${CEIDG_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: ${RABBITMQ_IMAGE}
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  krs-service:
    build:
      context: .
      dockerfile: krs-service/Dockerfile
    container_name: krs-service
    environment:
      SERVER_PORT: 8080
      DB_HOST: krs-db
      DB_PORT: 5432
      DB_NAME: ${KRS_DB_NAME}
      DB_USER: ${KRS_DB_USER}
      DB_PASSWORD: ${KRS_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "${KRS_SERVICE_PORT}:8080"
    depends_on:
      krs-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  raport-service:
    build:
      context: .
      dockerfile: raport-service/Dockerfile
    container_name: raport-service
    environment:
      SERVER_PORT: 8080
      DB_HOST: raport-db
      DB_PORT: 5432
      DB_NAME: ${RAPORT_DB_NAME}
      DB_USER: ${RAPORT_DB_USER}
      DB_PASSWORD: ${RAPORT_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "${RAPORT_SERVICE_PORT}:8080"
    depends_on:
      raport-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  whitelist-service:
    build:
      context: .
      dockerfile: whiteList-service/Dockerfile
    container_name: whitelist-service
    environment:
      SERVER_PORT: 8080
      DB_HOST: whitelist-db
      DB_PORT: 5432
      DB_NAME: ${WHITELIST_DB_NAME}
      DB_USER: ${WHITELIST_DB_USER}
      DB_PASSWORD: ${WHITELIST_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "${WHITELIST_SERVICE_PORT}:8080"
    depends_on:
      whitelist-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  crbr-service:
    build:
      context: .
      dockerfile: crbr-service/Dockerfile
    container_name: crbr-service
    environment:
      SERVER_PORT: 8080
      DB_HOST: crbr-db
      DB_PORT: 5432
      DB_NAME: ${CRBR_DB_NAME}
      DB_USER: ${CRBR_DB_USER}
      DB_PASSWORD: ${CRBR_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "${CRBR_SERVICE_PORT}:8080"
    depends_on:
      crbr-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  sudop-service:
    build:
      context: .
      dockerfile: sudop-service/Dockerfile
    container_name: sudop-service
    environment:
      SERVER_PORT: 8080
      DB_HOST: sudop-db
      DB_PORT: 5432
      DB_NAME: ${SUDOP_DB_NAME}
      DB_USER: ${SUDOP_DB_USER}
      DB_PASSWORD: ${SUDOP_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "${SUDOP_SERVICE_PORT}:8080"
    depends_on:
      sudop-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ceidg-service:
    build:
      context: .
      dockerfile: ceidg-service/Dockerfile
    container_name: ceidg-service
    environment:
      SERVER_PORT: 8080
      DB_HOST: ceidg-db
      DB_PORT: 5432
      DB_NAME: ${CEIDG_DB_NAME}
      DB_USER: ${CEIDG_DB_USER}
      DB_PASSWORD: ${CEIDG_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      CEIDG_API_TOKEN: ${CEIDG_API_TOKEN}
    ports:
      - "${CEIDG_SERVICE_PORT}:8080"
    depends_on:
      ceidg-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    environment:
      API_URL: http://raport-service:8080
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      # kod z hosta → zmiany widoczne od razu (hot reload)
      - ./frontend:/app
      # node_modules zostają z obrazu, nie z hosta
      - /app/node_modules
    depends_on:
      - raport-service

volumes:
  krs-db-data:
  raport-db-data:
  whitelist-db-data:
  crbr-db-data:
  sudop-db-data:
  ceidg-db-data:
  rabbitmq-data:
