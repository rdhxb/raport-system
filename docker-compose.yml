services:

  krs-db:
    image: ${POSTGRES_IMAGE}
    container_name: krs-db
    environment:
      POSTGRES_DB: ${KRS_DB_NAME}
      POSTGRES_USER: ${KRS_DB_USER}
      POSTGRES_PASSWORD: ${KRS_DB_PASSWORD}
    ports:
      - "${KRS_DB_PORT}:5432"
    volumes:
      - krs-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KRS_DB_USER} -d ${KRS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  krspdf-db:
    image: ${POSTGRES_IMAGE}
    container_name: krspdf-db
    environment:
      POSTGRES_DB: ${KRSPDF_DB_NAME}
      POSTGRES_USER: ${KRSPDF_DB_USER}
      POSTGRES_PASSWORD: ${KRSPDF_DB_PASSWORD}
    ports:
      - "${KRSPDF_DB_PORT}:5432"
    volumes:
      - krspdf-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KRSPDF_DB_USER} -d ${KRSPDF_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  raport-db:
    image: ${POSTGRES_IMAGE}
    container_name: raport-db
    environment:
      POSTGRES_DB: ${RAPORT_DB_NAME}
      POSTGRES_USER: ${RAPORT_DB_USER}
      POSTGRES_PASSWORD: ${RAPORT_DB_PASSWORD}
    ports:
      - "${RAPORT_DB_PORT}:5432"
    volumes:
      - raport-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RAPORT_DB_USER} -d ${RAPORT_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  whitelist-db:
    image: ${POSTGRES_IMAGE}
    container_name: whitelist-db
    environment:
      POSTGRES_DB: ${WHITELIST_DB_NAME}
      POSTGRES_USER: ${WHITELIST_DB_USER}
      POSTGRES_PASSWORD: ${WHITELIST_DB_PASSWORD}
    ports:
      - "${WHITELIST_DB_PORT}:5432"
    volumes:
      - whitelist-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WHITELIST_DB_USER} -d ${WHITELIST_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: ${RABBITMQ_IMAGE}
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  krs-service:
    build:
      context: .
      dockerfile: krs-service/Dockerfile
    container_name: krs-service
    environment:
      SERVER_PORT: 8080
      DB_HOST: krs-db
      DB_PORT: 5432
      DB_NAME: ${KRS_DB_NAME}
      DB_USER: ${KRS_DB_USER}
      DB_PASSWORD: ${KRS_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "${KRS_SERVICE_PORT}:8080"
    depends_on:
      krs-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  krspdf-service:
    build:
      context: .
      dockerfile: krsPdf-service/Dockerfile
    container_name: krspdf-service
    environment:
      SERVER_PORT: 8080
      DB_HOST: krspdf-db
      DB_PORT: 5432
      DB_NAME: ${KRSPDF_DB_NAME}
      DB_USER: ${KRSPDF_DB_USER}
      DB_PASSWORD: ${KRSPDF_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      PDF_STORAGE_DIR: /app/data/pdf
    ports:
      - "${KRSPDF_SERVICE_PORT}:8080"
    volumes:
      - krspdf-pdf-data:/app/data/pdf
    depends_on:
      krspdf-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  raport-service:
    build:
      context: .
      dockerfile: raport-service/Dockerfile
    container_name: raport-service
    environment:
      SERVER_PORT: 8080
      DB_HOST: raport-db
      DB_PORT: 5432
      DB_NAME: ${RAPORT_DB_NAME}
      DB_USER: ${RAPORT_DB_USER}
      DB_PASSWORD: ${RAPORT_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "${RAPORT_SERVICE_PORT}:8080"
    depends_on:
      raport-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  whitelist-service:
    build:
      context: .
      dockerfile: whiteList-service/Dockerfile
    container_name: whitelist-service
    environment:
      SERVER_PORT: 8080
      DB_HOST: whitelist-db
      DB_PORT: 5432
      DB_NAME: ${WHITELIST_DB_NAME}
      DB_USER: ${WHITELIST_DB_USER}
      DB_PASSWORD: ${WHITELIST_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "${WHITELIST_SERVICE_PORT}:8080"
    depends_on:
      whitelist-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  krs-db-data:
  krspdf-db-data:
  krspdf-pdf-data:
  raport-db-data:
  whitelist-db-data:
  rabbitmq-data:
