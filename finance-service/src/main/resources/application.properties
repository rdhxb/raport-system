spring.application.name=finance-service
server.port=${SERVER_PORT:8089}

# PostgreSQL - defaults match .env for running locally outside Docker
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5440}/${DB_NAME:finance_db}
spring.datasource.username=${DB_USER:finance_user}
spring.datasource.password=${DB_PASSWORD:finance_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:rabbit_user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rabbit_password}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Upload of financial statements (XML / XAdES) - statements are usually < 1 MB
spring.servlet.multipart.max-file-size=${FINANCE_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${FINANCE_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.enabled=true
