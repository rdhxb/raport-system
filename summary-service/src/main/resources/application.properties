spring.application.name=summary-service
server.port=${SERVER_PORT:8088}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:rabbit_user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rabbit_password}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# Jetson handles one generation at a time - don't prefetch more messages
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1

##dlq / retry
#spring.rabbitmq.listener.simple.retry.enabled=true
#spring.rabbitmq.listener.simple.retry.max-retries=3
#spring.rabbitmq.listener.simple.retry.initial-interval=5s
#spring.rabbitmq.listener.simple.retry.multiplier=2
#spring.rabbitmq.listener.simple.retry.max-interval=30s

# Ollama (local LLM on Jetson) - defaults for running locally outside Docker
ollama.url=${OLLAMA_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen3:4b}
